spring.application.name=virtual-thread-task-handling

# Redis Connection Configuration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.username=${REDIS_USERNAME:default}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=${REDIS_TIMEOUT:2000ms}
spring.data.redis.lettuce.shutdown-timeout=${REDIS_SHUTDOWN_TIMEOUT:100ms}

# Redis Messaging Configuration
orchestrator.redis.messaging.task-channel=${REDIS_TASK_CHANNEL:orchestrator:tasks:events}
orchestrator.redis.messaging.agent-topic=${REDIS_AGENT_TOPIC:agent-orchestrator}
orchestrator.redis.messaging.enabled=${REDIS_MESSAGING_ENABLED:true}
