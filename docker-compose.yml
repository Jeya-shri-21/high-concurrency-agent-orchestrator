name: high-concurrency-agent-orchestrator

services:
  # ----------------------------------------------------------------------------
  # Redis Service - Distributed Locking, Messaging & Node Load Registry
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7.4-alpine
    container_name: orchestrator-redis
    command: ["redis-server", "--appendonly", "yes", "--loglevel", "notice"]
    restart: unless-stopped
    ports:
      - "${REDIS_PORT_HOST:-6379}:6379"
    volumes:
      - redis-data:/data
    networks:
      - orchestrator-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s

  # ----------------------------------------------------------------------------
  # Primary Orchestrator Node (Default)
  # ----------------------------------------------------------------------------
  orchestrator:
    build:
      context: .
      dockerfile: Dockerfile
    image: high-concurrency-agent-orchestrator:latest
    container_name: orchestrator-node-1
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:8080"
      - "${GRPC_PORT:-9090}:9090"
    environment:
      - SERVER_PORT=8080
      - GRPC_SERVER_PORT=9090
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - SPRING_DATA_REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - ORCHESTRATOR_NODE_ID=${NODE_ID_PRIMARY:-node-1}
      - ORCHESTRATOR_NODE_LOAD_TTL_SECONDS=${NODE_LOAD_TTL_SECONDS:-15}
      - ORCHESTRATOR_LOCK_TYPE=${LOCK_TYPE:-redis}
      - JAVA_TOOL_OPTIONS=${JAVA_TOOL_OPTIONS:---enable-preview -XX:+UseG1GC -XX:MaxRAMPercentage=75.0}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - orchestrator-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ----------------------------------------------------------------------------
  # Secondary Orchestrator Node (Activated with --profile multi-node)
  # ----------------------------------------------------------------------------
  orchestrator-node-2:
    image: high-concurrency-agent-orchestrator:latest
    container_name: orchestrator-node-2
    restart: unless-stopped
    profiles:
      - multi-node
    ports:
      - "${HTTP_PORT_NODE2:-8081}:8080"
      - "${GRPC_PORT_NODE2:-9091}:9090"
    environment:
      - SERVER_PORT=8080
      - GRPC_SERVER_PORT=9090
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - SPRING_DATA_REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - ORCHESTRATOR_NODE_ID=${NODE_ID_SECONDARY:-node-2}
      - ORCHESTRATOR_NODE_LOAD_TTL_SECONDS=${NODE_LOAD_TTL_SECONDS:-15}
      - ORCHESTRATOR_LOCK_TYPE=${LOCK_TYPE:-redis}
      - JAVA_TOOL_OPTIONS=${JAVA_TOOL_OPTIONS:---enable-preview -XX:+UseG1GC -XX:MaxRAMPercentage=75.0}
    depends_on:
      redis:
        condition: service_healthy
      orchestrator:
        condition: service_started
    networks:
      - orchestrator-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

# ------------------------------------------------------------------------------
# Shared Bridge Network & Persistent Volumes
# ------------------------------------------------------------------------------
networks:
  orchestrator-network:
    driver: bridge

volumes:
  redis-data:
    driver: local
